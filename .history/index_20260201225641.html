<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Voice AI Agent</title>
</head>
<body>
    <div class="container">
    <h2>🎤 Voice AI Meeting Assistant</h2>

    <div id= "upload-area" class="upload-row">
        <input type="file"  id="audioFile">
        <button onclick="send()">Upload</button>
    </div>

    <p id="fileName">No file selected</p>

    <div class="box">
        <h3>📝 Transcript</h3>
        <p id="transcript">Waiting for audio...</p>
    </div>

    <div class="box">
        <h3>📌 AI Summary</h3>
        <p id="summary">Waiting for analysis...</p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
