<!DOCTYPE html>
<html>
<head>
  <title>Voice AI Agent</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
    }
    .box {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      background: #f9f9f9;
    }
    button {
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>🎤 Voice AI Meeting Assistant</h2>

<input type="file" id="audioFile">
<br><br>
<button onclick="send()">Upload & Analyze</button>

<div class="box">
  <h3>📝 Transcript</h3>
  <p id="transcript">Waiting for audio...</p>
</div>

<div class="box">
  <h3>📌 AI Summary</h3>
  <p id="summary">Waiting for analysis...</p>
</div>

<script>
async function send() {
  const file = document.getElementById("audioFile").files[0]
  const form = new FormData()
  form.append("file", file)

  document.getElementById("transcript").innerText = "Processing..."
  document.getElementById("summary").innerText = "AI is thinking..."

  const res = await fetch("http://127.0.0.1:8000/voice-agent", {
    method: "POST",
    body: form
  })

  const data = await res.json()

  document.getElementById("transcript").innerText = data.transcript
  document.getElementById("summary").innerText = data.summary
}
</script>

</body>
</html>
