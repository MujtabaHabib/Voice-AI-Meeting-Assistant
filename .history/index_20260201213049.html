<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Voice AI Agent</title>
</head>
<body>
    <h2>🎤 Voice AI Meeting Assistant</h2>

    <input type="file" name="file" id="audioFile">
    <br><br>
    <button onclick="send()">Upload</button>

    <div class="box">
        <h3>📝 Transcript</h3>
        <p id="transcript">Waiting for audio</p>
    </div>

    <div class="box">
        <h3>📌 AI Summary</h3>
        <p id="summary">Waiting for Analysis</p>
    </div>

<script>
    async function send() {
        const file = document.getElementById("audioFile").files[0]
        const form = new FormData()
        form.append("file",file)

    const res = await fetch("http://127.0.0.1:8000/voice-agent",{
        method : "POST",
        body : form
    })

    const data = await res.json()
    document.getElementById("output").textContent= JSON.stringify(data,null,2)
}
</script>
</body>
</html>
